{% extends "base.html" %}

{% block title %}
MY RESUMES
{% endblock %}

{% block content %}
<h1>MY RESUMES</h1>

{% for resume in resumes %}
    <p>
        Resume id: {{resume.id}}
    </p>
    <p>
        file: {{resume.file.name}}
    </p>
    <form method="post" action="{% url 'resume_delete' resume.id %}">
        {% csrf_token %}
        <button type="submit">DELETE</button>
    </form>
{% empty %}
    <p>
        None uploaded
    </p>
{% endfor %}
<a href="{% url 'upload_resume' %}">
    <button>
        UPLOAD
    </button>
</a>

{% endblock %}

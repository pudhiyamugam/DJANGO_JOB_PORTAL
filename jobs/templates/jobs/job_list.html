{% extends "base.html"%}
{% block title %}
HOME PAGE
{% endblock %}

{% block content %}
<form method="get">
    <input
    type="text",
    name="q",
    placeholder="search jobs",
    value="{{query|default:''}}">
    <button type="submit">
        search
    </button>

</form>
{% for job in jobs %}
    <div>
        <h2>{{job.title}}</h2>
        <p>{{job.company}}</p>
        <p>{{job.salary}}</p>
        <p>{{job.location}}</p>
        <p>{{job.descritpion}}</p>

        <form method="post" action="{% url 'apply_job' job.id %}">
            {% csrf_token %}
            <button type="submit">
                Apply
            </button>
        </form>

    </div>
    <hr>
{% empty %}
    <p>{{query}} is not found</p>
{% endfor %}
{% endblock %}
